spring.application.name=cap45-backend
server.port=8080
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/cap45_db
spring.datasource.username=cap45_user
spring.datasource.password=${CAP45_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health,info
